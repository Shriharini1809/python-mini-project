<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess Number Mini Project</title>
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- fontawesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- BOOTSTRAP CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="big-container">
      <div class="small-container">
        <form action="/set-level" method="post">
          <p class="welcome-text">Welcome <span>Guys</span>👋</p>
          <div class="choose-the-level">
            <div class="level-text">Choose the Level :</div>
            <div class="levels">
              <div class="stages">
                <input type="radio" name="level" id="easy" value="easy" 
                {% if session.get("level") == "easy" %}checked{% endif %}
                /><label
                  for="easy"
                  class="l1"
                  >Easy</label
                >
              </div>
              <div class="stages">
                <input
                  type="radio"
                  name="level"
                  id="medium"
                  value="medium"
                  {% if session.get("level") == "medium" %}checked{% endif %}
                /><label for="medium" class="l2">Medium</label>
              </div>
              <div class="stages">
                <input type="radio" name="level" id="hard" value="hard"
                  {% if session.get("level") == "hard" %}checked {% endif %} 
                /><label
                  for="hard"
                  class="l3"
                  >Hard</label
                >
              </div>
            </div>
          </div>
          <div class="confirm-btn">
            <button type="submit" class="btn btn-primary btn-sm">
              Confirm the Level
            </button>
          </div>
        </form>
        <form action="/guess-number" method="post">
          <div class="input-guess">
            <div>
              <label for="guessed-number">Enter the Guessed Number</label>
            </div>
            <div><input type="text" placeholder="" name="input"/></div>
            <div>
              <button class="btn btn-sm btn-primary" type="submit">
                Guess Number
              </button>
            </div>
          </div>
          <div class="output">
            <p class="attempts">Attempts Left: {{ attempt }}</p>
            <p class="output-text">{{result}}</p>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
